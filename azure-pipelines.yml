trigger:
  branches:
    include:
      - main
pr:
  - main

jobs:
  - job: Linux
    pool:
      # https://docs.microsoft.com/en-us/azure/devops/pipelines/agents/hosted?view=azure-devops&tabs=yaml#use-a-microsoft-hosted-agent
      name: Hosted Ubuntu 1604
      demands: npm
    strategy:
      matrix:
        node_20_x:
          node_version: 20.x
        node_22_x:
          node_version: 22.x
    steps:
      - task: NodeTool@0
        displayName: 'Use $(node_version)'
        inputs:
          versionSpec: $(node_version)

      - task: Npm@1
        displayName: 'Install dependencies'
        inputs:
          verbose: false
          command: install

      - task: Npm@1
        displayName: 'Run tests'
        inputs:
          command: custom
          verbose: false
          customCommand: 'run test'

  - job: macOS
    pool:
      # https://docs.microsoft.com/en-us/azure/devops/pipelines/agents/hosted?view=azure-devops&tabs=yaml#use-a-microsoft-hosted-agent
      name: Hosted macOS
      demands: npm
    strategy:
      matrix:
        node_20_x:
          node_version: 20.x
        node_22_x:
          node_version: 22.x
    steps:
      - task: NodeTool@0
        displayName: 'Use $(node_version)'
        inputs:
          versionSpec: $(node_version)

      - task: Npm@1
        displayName: 'Install dependencies'
        inputs:
          verbose: false
          command: install

      - task: Npm@1
        displayName: 'Run tests'
        inputs:
          command: custom
          verbose: false
          customCommand: 'run test'
